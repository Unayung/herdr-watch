name: HerdrWatch
options:
  bundleIdPrefix: dev.unayung
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

targets:
  HerdrWatch:
    type: application
    platform: watchOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: herdr
        PRODUCT_BUNDLE_IDENTIFIER: dev.unayung.herdrwatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        # Without this, watchOS looks for a companion iOS app and refuses to install.
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: herdr
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        # Set this to your team, or set it once in Xcode's Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
